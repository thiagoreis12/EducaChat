[project]
name = "educachat"
version = "0.1.0"
description = "EducaChat: assistente pedagógico ancorado na BNCC (RAG com filtro por série)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
educachat-parse = "educachat.parsing.cli:main"
educachat-ingest = "educachat.ingestion.cli:main"
educachat-api = "educachat.api.main:run"

# Sem GPU no ambiente de desenvolvimento: torch CPU evita ~2 GB de bibliotecas CUDA.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/educachat", "test_suite"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "T20"]  # T20 proíbe print()
ignore = [
    "RUF001", "RUF002", "RUF003",  # caracteres ambíguos (º, –) são legítimos em PT-BR
    "N818",  # exceções com nome em português (ErroX) em vez do sufixo Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:."
packages = ["educachat", "test_suite"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*", "chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true

# PyMuPDF só é parcialmente anotado; chamadas a ele não quebram o modo strict.
[[tool.mypy.overrides]]
module = ["educachat.parsing.*"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integracao: usa a base Chroma real e o modelo de embedding (mais lento)"]
filterwarnings = ["ignore::DeprecationWarning"]
